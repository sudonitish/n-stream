<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <h1>Chilling</h1>
    <div id="createRoomDiv">
        <input type="text" id="roomInput" placeholder="Enter a room name">
        <button id="joinButton">Join room</button>
        
    </div>
    <div id="roomDiv" style="display: none;">
        <div id="player"></div>
        <div>
            <input type="text" id="urlInput" placeholder="Enter a YouTube URL">
            <button id="uploadMediaButton">Add Media</button>
            <button id="leaveButton">Leave room</button>
            <div>
                <button id="prevButton">Prev</button>
                <button id="nextButton">Next</button>
            </div>
            <div id="playlistDiv">

            </div>
        </div>
    </div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="main.js"></script>
</body>

</html>
